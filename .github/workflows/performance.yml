name: Performance

# Benchmarks train real models, so they are too slow and too noisy to gate
# pull requests. They run on demand and on a weekly schedule instead.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Training benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,viz]
      # Two overrides of pyproject.toml's addopts, both required:
      #   --no-cov         because the repository-wide --cov-fail-under would
      #                    measure what the performance tests alone happen to
      #                    reach (~29%) and fail the job, saying nothing about
      #                    whether the benchmarks passed.
      #   -m performance   because addopts deselects that marker, to keep
      #                    wall-clock assertions out of the correctness gate.
      #                    Without this the job collects nothing and pytest
      #                    exits 5, which reads as a failure.
      - run: pytest tests/performance -q --no-cov -m performance
      - run: python scripts/benchmark_training.py
      - run: python scripts/benchmark_distributed.py
      # customSmallerIsBetter expects a bare JSON *array* of
      # {name, unit, value} entries. Wrapping them in a {"benchmarks": [...]}
      # object makes the action fail with "expected array, received object".
      - run: |
          python - <<'PY'
          import json

          with open('benchmark_report.json') as f:
              data = json.load(f)
          out = [
              {'name': r['name'], 'unit': 's', 'value': r['duration_sec']}
              for r in data
          ]
          with open('benchmark.json', 'w') as f:
              json.dump(out, f)
          PY
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: training
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          benchmark-data-dir-path: benchmark-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          fail-on-alert: false
