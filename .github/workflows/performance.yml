name: Performance

# Benchmarks train real models, so they are too slow and too noisy to gate
# pull requests. They run on demand and on a weekly schedule instead.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Training benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,viz]
      - run: pytest tests/performance -q
      - run: python scripts/benchmark_training.py
      - run: python scripts/benchmark_distributed.py
      - run: |
          python - <<'PY'
          import json

          with open('benchmark_report.json') as f:
              data = json.load(f)
          out = {'benchmarks': [
              {'name': r['name'], 'value': r['duration_sec'], 'unit': 's'}
              for r in data
          ]}
          with open('benchmark.json', 'w') as f:
              json.dump(out, f)
          PY
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: training
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          benchmark-data-dir-path: benchmark-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          fail-on-alert: false
