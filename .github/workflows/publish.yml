name: Publish

# Publishes to PyPI when a version tag is pushed, using PyPI's trusted
# publishing: the job authenticates with a short-lived OIDC token minted by
# GitHub for this specific repository and workflow. No API token is stored in
# the repository, so there is no long-lived credential to leak or rotate.
#
# The trusted publisher registered on pypi.org is:
#   PyPI project: pinnlab
#   owner:        DiogoRibeiro7
#   repository:   pinn
#   workflow:     publish.yml
#   environment:  (not set)
#
# The environment field is optional on PyPI and is left unset here, so no
# GitHub environment is declared below either. Adding one later would let you
# gate a publish behind required reviewers; it would also have to be added to
# the publisher on PyPI to keep matching.
#
# Running this workflow manually builds and runs every check without
# uploading anything, which is the way to rehearse a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check artifact metadata
        run: twine check --strict dist/*

      # The version in the tag and the version in the package must agree, or
      # the release on PyPI silently describes a different commit than the tag.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          assert match, "no version found in pyproject.toml"
          declared = match.group(1)
          if declared != tag:
              raise SystemExit(
                  f"tag v{tag} does not match pyproject version {declared}"
              )
          print(f"tag and package agree on {declared}")
          PY

      # Catches the classic packaging mistake: a wheel that installs but is
      # missing modules, or one carrying caches and test leftovers. The venv is
      # deliberately isolated -- with --system-site-packages pip would find the
      # package already satisfied and skip installing the artifact, and the
      # check would pass without testing anything.
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python - <<'PY'
          import importlib.metadata as md

          import pinnlab

          print("version:", pinnlab.__version__)
          print("distribution:", md.version("pinnlab"))
          for name in ("solvers", "training", "problems", "geometry", "models"):
              __import__(f"pinnlab.{name}")
          print("subpackages import cleanly")
          PY
          /tmp/probe/bin/pinnlab --help > /dev/null && echo "console script runs"

      - name: Reject stray files in the artifacts
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          bad = ("__pycache__", ".pyc", ".ipynb_checkpoints", ".pytest_cache",
                 "benchmark_report.json", "benchmark.json", ".coverage")
          problems = []
          for path in pathlib.Path("dist").iterdir():
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              else:
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              problems += [f"{path.name}: {n}" for n in names
                           if any(token in n for token in bad)]
          if problems:
              raise SystemExit("stray files in artifacts:\n  " + "\n  ".join(problems))
          print("artifacts are clean")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Upload to PyPI
    needs: build
    # Only a version tag publishes. A manual run stops after the checks above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
