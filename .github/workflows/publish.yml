name: Publish

# Publishes to PyPI when a version tag is pushed, using PyPI's trusted
# publishing: the job authenticates with a short-lived OIDC token minted by
# GitHub for this specific repository, workflow and environment. No API token
# is stored in the repository, so there is no long-lived credential to leak or
# rotate.
#
# One-time setup on pypi.org, under the project's Publishing settings:
#   owner:       DiogoRibeiro7
#   repository:  pinn
#   workflow:    publish.yml
#   environment: pypi
# Until that publisher exists, the upload step fails with an authentication
# error -- the build and the checks above it still run, so a dry run via
# workflow_dispatch is safe.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to upload'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, none]

permissions:
  contents: read

jobs:
  build:
    name: Build and check artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check artifact metadata
        run: twine check --strict dist/*

      # The version in the tag and the version in the package must agree, or
      # the release on PyPI silently describes a different commit than the tag.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          assert match, "no version found in pyproject.toml"
          declared = match.group(1)
          if declared != tag:
              raise SystemExit(
                  f"tag v{tag} does not match pyproject version {declared}"
              )
          print(f"tag and package agree on {declared}")
          PY

      # Catches the classic packaging mistake: a wheel that installs but is
      # missing modules, or one carrying caches and test leftovers.
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python - <<'PY'
          import importlib.metadata as md

          import pinnkit

          print("version:", pinnkit.__version__)
          print("distribution:", md.version("pinnkit"))
          for name in ("solvers", "training", "problems", "geometry", "models"):
              __import__(f"pinnkit.{name}")
          print("subpackages import cleanly")
          PY
          /tmp/probe/bin/pinnkit --help > /dev/null && echo "console script runs"

      - name: Reject stray files in the artifacts
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          bad = ("__pycache__", ".pyc", ".ipynb_checkpoints", ".pytest_cache",
                 "benchmark_report.json", "benchmark.json", ".coverage")
          problems = []
          for path in pathlib.Path("dist").iterdir():
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              else:
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              problems += [f"{path.name}: {n}" for n in names
                           if any(token in n for token in bad)]
          if problems:
              raise SystemExit("stray files in artifacts:\n  " + "\n  ".join(problems))
          print("artifacts are clean")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Upload to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
