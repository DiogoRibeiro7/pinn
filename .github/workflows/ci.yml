name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,viz]
      - run: black --check .
      - run: flake8 .
      - run: bandit -r src -ll
      # Blocking, with no exemptions: every module under src/ type-checks.
      # The [[tool.mypy.overrides]] backlog this used to reference is gone.
      - run: mypy src

  metadata:
    name: Validate citation metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate CITATION.cff
        run: |
          pip install cffconvert
          cffconvert --validate
      - name: Validate .zenodo.json
        run: python -c "import json; json.load(open('.zenodo.json'))"

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,viz]
      # Executing the examples is what would have caught DiscreteRKPINN sitting
      # in the public API unable to take a single step; the only test touching
      # it checked that it imported. All sixteen run here, in about three
      # minutes, now that every one of them takes a budget flag.
      - name: Smoke-test examples
        run: python scripts/smoke_examples.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,viz]
      - run: pytest --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
