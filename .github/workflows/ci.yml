name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: black --check .
      - run: flake8 .
      - run: mypy src
      - run: bandit -r src -ll

  metadata:
    name: Validate citation metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate CITATION.cff
        run: |
          pip install cffconvert
          cffconvert --validate
      - name: Validate .zenodo.json
        run: python -c "import json; json.load(open('.zenodo.json'))"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  gpu-tests:
    if: runner.os == 'Linux'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev] torch --index-url https://download.pytorch.org/whl/cu118
      - run: pytest -q tests/unit/test_advanced_models.py
