name: Bug report
description: Something behaves differently from how it is documented or intended.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues —
        see [SECURITY.md](https://github.com/DiogoRibeiro7/pinn/blob/main/SECURITY.md)
        for private reporting instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        The shortest script that shows the problem. Please include the full
        traceback if there is one.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: pinn version
      description: "`python -c \"import pinnkit; print(pinn.__version__)\"`, or the commit SHA."
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.1"
    validations:
      required: true

  - type: input
    id: torch-version
    attributes:
      label: PyTorch version
      description: "`python -c \"import torch; print(torch.__version__)\"`"
      placeholder: "2.13.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - CPU
        - CUDA
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: >-
        Which PDE and solver, roughly how long training ran, or anything else
        that might matter. Numerical issues in particular are often
        configuration-dependent.
