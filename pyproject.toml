[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnlab"
version = "0.6.1"
description = "Physics-Informed Neural Network implementations"
authors = [{name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}]
maintainers = [{name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
    "physics-informed neural networks",
    "pinn",
    "scientific machine learning",
    "partial differential equations",
    "deep learning",
    "pytorch",
    "inverse problems",
    "uncertainty quantification",
    "computational physics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.2.6",
    "PyYAML>=6.0.3",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# matplotlib and seaborn moved to the required dependencies; these two are
# genuinely optional and degrade with a warning when absent.
# Everything needed to plot. `import pinnlab` no longer touches any of it:
# pinnlab.utils.visualization is imported on first access, so the solver path
# runs without matplotlib installed at all.
viz = [
    "matplotlib>=3.10.9",
    "plotly>=6.9.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.1",
    "jupyter>=1.0.0",
    "ipykernel>=7.3.0",
    # The three tools that gate CI are pinned exactly. Their output changes
    # between releases -- black reformats, flake8 and bandit add new checks --
    # so an unpinned version makes CI disagree with a local run that passed.
    "black==26.5.1",
    "mypy",
    "flake8==7.3.0",
    "bandit==1.9.4",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "pytest-benchmark>=5.2.3",
    # tests/unit/test_packaging.py reads pyproject.toml; tomllib is stdlib
    # only from 3.11, and the package supports 3.10.
    'tomli>=2.0; python_version < "3.11"',
]
gpu = ["cupy-cuda11x"]
deploy = ["fastapi>=0.141.1", "uvicorn>=0.52.1", "grpcio>=1.54"]

[project.scripts]
pinnlab = "pinnlab.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    notebooks
  | docs/_build
)/
'''

[tool.mypy]
# Must be 3.12 or newer even though the package supports 3.10. numpy ships
# PEP 695 `type` statements in its own stubs, which mypy only parses when the
# target is >= 3.12; with an older target it aborts on
# `numpy/__init__.pyi: Type statement is only supported in Python 3.12 and
# greater`, reports "errors prevented further checking", and checks zero source
# files. This setting is what makes the type check actually run.
python_version = "3.12"
ignore_missing_imports = true

# flake8 configuration lives in .flake8 — flake8 cannot read pyproject.toml.

# There is no type-check backlog. Every module under src/ passes mypy, and the
# check is blocking in CI, so new code cannot introduce type errors.
#
# This block used to carry an explicit exemption list -- 27 modules and 93
# errors on 2026-08-11 -- written one module per line rather than as a wildcard
# so a pattern could not silently re-exempt new files. It is now empty and has
# been removed. If a change would need it back, the change should carry the fix
# instead.

[tool.bandit]
exclude = ["tests"]

[tool.pytest.ini_options]
# The gate is a ratchet set just under the measured figure so coverage cannot
# regress. Measured on 2026-08-11 after the Allen-Cahn and discrete-RK suites
# landed: 65.93% in CI and 66.50% locally. CI reports the *same* figure on all
# six matrix cells -- ubuntu 3.10-3.13, macOS and Windows -- so the headroom
# here is for future drift, not for platform variation, of which there is
# currently none. Note the direction: CI is slightly below local, not above.
# Raise it as tests are added; see ROADMAP.md.
# -m "not performance" keeps wall-clock assertions out of the correctness gate.
# tests/performance/test_mlp_performance.py asserts 100 forward passes finish
# inside a second, which is a statement about the machine, not the code: it
# failed once in a full-gate run that took 18 minutes under load and passed
# immediately on a quiet one. Those tests still run, in their own
# performance.yml workflow, where a slow result means something.
addopts = """-q -m "not performance" --cov=pinnlab     --cov-report=term-missing --cov-fail-under=64"""
testpaths = ["tests"]
markers = [
    "integration: integration tests",
    "performance: performance benchmarks",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/pinn"
Repository = "https://github.com/DiogoRibeiro7/pinn"
Documentation = "https://DiogoRibeiro7.github.io/pinn"
Issues = "https://github.com/DiogoRibeiro7/pinn/issues"
Changelog = "https://github.com/DiogoRibeiro7/pinn/blob/main/CHANGELOG.md"
