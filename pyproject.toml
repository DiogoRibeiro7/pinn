[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn"
version = "0.1.0"
description = "Physics-Informed Neural Network implementations"
authors = [{name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com"}]
maintainers = [{name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
    "physics-informed neural networks",
    "pinn",
    "scientific machine learning",
    "partial differential equations",
    "deep learning",
    "pytorch",
    "inverse problems",
    "uncertainty quantification",
    "computational physics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.2.6",
    "PyYAML>=6.0.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10.9", "seaborn>=0.11.0", "plotly>=6.9.0", "scipy>=1.15.3"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=3.0.0",
    "hypothesis>=6.165.1",
    "jupyter>=1.0.0",
    "ipykernel>=7.3.0",
    # The three tools that gate CI are pinned exactly. Their output changes
    # between releases -- black reformats, flake8 and bandit add new checks --
    # so an unpinned version makes CI disagree with a local run that passed.
    "black==26.5.1",
    "mypy",
    "flake8==7.3.0",
    "bandit==1.9.4",
    "sphinx>=5.0",
    "sphinx-autodoc-typehints>=1.19",
    "pytest-benchmark>=3.4.0",
]
gpu = ["cupy-cuda11x"]
deploy = ["fastapi>=0.95", "uvicorn>=0.20", "grpcio>=1.54"]

[project.scripts]
pinn = "pinn.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    notebooks
  | docs/_build
)/
'''

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# flake8 configuration lives in .flake8 — flake8 cannot read pyproject.toml.

[tool.bandit]
exclude = ["tests"]

[tool.pytest.ini_options]
# The gate is a ratchet set just under the measured figure (54%) so coverage
# cannot regress, with headroom for platform variation. Raise it as tests are
# added; see ROADMAP.md.
addopts = "-q --cov=pinn --cov-report=term-missing --cov-fail-under=50"
testpaths = ["tests"]
markers = [
    "integration: integration tests",
    "performance: performance benchmarks",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/pinn"
Repository = "https://github.com/DiogoRibeiro7/pinn"
Documentation = "https://DiogoRibeiro7.github.io/pinn"
Issues = "https://github.com/DiogoRibeiro7/pinn/issues"
Changelog = "https://github.com/DiogoRibeiro7/pinn/blob/main/CHANGELOG.md"
